services:
  selenium-hub:
    image: selenium/hub:4.25.0
    ports:
    - 4442:4442
    - 4443:4443
    - 4444:4444
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:4444/wd/hub/status
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - test-network
  chrome:
    image: selenium/node-chrome:4.25.0
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
    - SE_EVENT_BUS_HOST=selenium-hub
    - SE_EVENT_BUS_PUBLISH_PORT=4442
    - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    - SE_NODE_MAX_SESSIONS=2
    - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    - SE_VNC_NO_PASSWORD=1
    shm_size: 2g
    ports:
    - 7900:5900
    networks:
    - test-network
  firefox:
    image: selenium/node-firefox:4.25.0
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
    - SE_EVENT_BUS_HOST=selenium-hub
    - SE_EVENT_BUS_PUBLISH_PORT=4442
    - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    - SE_NODE_MAX_SESSIONS=2
    - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    - SE_VNC_NO_PASSWORD=1
    shm_size: 2g
    ports:
    - 7901:5900
    networks:
    - test-network
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      chrome:
        condition: service_started
      selenium-hub:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL:-}
      API_URL: ${API_URL:-}
      HEADLESS: 'true'
      BROWSER: chrome
      SELENIUM_GRID_URL: http://selenium-hub:4444/wd/hub
      DEMO_BROWSER_HOST: tests
    volumes:
    - ./reports:/app/reports
    - ./screenshots:/app/screenshots
    networks:
    - test-network
  tests-local:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BASE_URL: ${BASE_URL:-}
      API_URL: ${API_URL:-}
      HEADLESS: 'true'
      BROWSER: chrome
    volumes:
    - ./reports:/app/reports
    - ./screenshots:/app/screenshots
    command:
    - pytest
    - tests/
    - --alluredir=reports/allure-results
    - --tb=short
    networks:
    - test-network
    profiles:
    - local
networks:
  test-network:
    driver: bridge
